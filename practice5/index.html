<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS objects practice</title>
</head>
<body>
    <script>
        let product={
            company:'puma',
            name:'Pant',
            'delivery-time':'10:30',

             dress2:{
                company:'puma',
                name:'Pant',
                'delivery-time':'10:30',
            },

            isIdenticalProduct: function(obj1,obj2){
                return (obj1.name==obj2.name)?'Identical':'Not Identical';
            }
        }

        let pr=product;
        console.log(pr);
        pr.company='Addidas';
        console.log(product);
        console.log(product['delivery-time']);

        let obj={
            message:'good job',
            status:'complete',
        }

        let {message:coment,status}=obj;
        console.log(coment);
        console.log(status);
        console.log(  product.isIdenticalProduct(product,product.dress2));
    </script>
</body>
</html>
