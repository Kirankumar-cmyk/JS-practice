<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions practice</title>
</head>
<body>
    <script>
        function checkEvenOdd(num){
            return (num%2==0) ? 'Even':'Odd'
        }
        console.log(checkEvenOdd(9));

        function largeOfTwo(a,b){
            return (a>b)?a:b;
        }

        console.log(largeOfTwo(-1,6))

        function celsiusToFahrenheit(c){
            return (c*9/5)+32;
        }

        console.log(celsiusToFahrenheit(2));
    </script>
</body>
</html>
